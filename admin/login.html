<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Login — Chandru Govindaraj</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#060611;--bg2:#0c0c1a;--card:#0f0f20;
  --acc:#b8ff3c;--txt:#f0f0f8;--muted:#666;
  --bdr:rgba(255,255,255,0.06);--bdra:rgba(184,255,60,0.2);
  --f1:'Plus Jakarta Sans',sans-serif;--f2:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);font-family:var(--f1);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:2rem;-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 55% at 25% 35%,rgba(184,255,60,0.04) 0%,transparent 65%),
    radial-gradient(ellipse 50% 50% at 80% 75%,rgba(80,130,255,0.025) 0%,transparent 65%);
}
.wrap{width:100%;max-width:420px;position:relative;z-index:1;animation:fadeIn .5s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.brand{text-align:center;margin-bottom:2.5rem;}
.brand-logo{font-size:2.5rem;font-weight:900;letter-spacing:-2px;margin-bottom:.35rem;}
.brand-logo span{color:var(--acc);}
.brand-sub{font-family:var(--f2);font-size:.68rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;}
.card{
  background:var(--card);border:1px solid var(--bdr);
  border-radius:20px;padding:2.5rem;
}
.card-icon{
  width:52px;height:52px;background:rgba(184,255,60,0.08);border:1px solid var(--bdra);
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;margin:0 auto 1.5rem;
}
.card h2{font-size:1.3rem;font-weight:800;margin-bottom:.3rem;text-align:center;}
.card p{font-size:.82rem;color:var(--muted);text-align:center;margin-bottom:2rem;}
.fg{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.25rem;}
.fg label{font-family:var(--f2);font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.inp-wrap{position:relative;}
.fg input{
  width:100%;background:var(--bg2);border:1.5px solid var(--bdr);
  border-radius:10px;padding:.85rem 1rem;color:var(--txt);
  font-family:var(--f1);font-size:.92rem;outline:none;
  transition:border-color .25s,box-shadow .25s;
}
.fg input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(184,255,60,0.07);}
.eye-btn{
  position:absolute;right:.9rem;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:1rem;transition:color .2s;padding:4px;
}
.eye-btn:hover{color:var(--txt);}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;}
.rem{display:flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.8rem;color:var(--muted);}
.rem input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px;}
.btn-login{
  width:100%;padding:.92rem;background:var(--acc);color:#000;
  font-family:var(--f1);font-size:.95rem;font-weight:800;
  border:none;border-radius:50px;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .25s,box-shadow .25s;
}
.btn-login::before{
  content:'';position:absolute;inset:0;background:rgba(255,255,255,.25);
  transform:translateX(-110%) skewX(-18deg);transition:transform .5s;
}
.btn-login:hover::before{transform:translateX(110%) skewX(-18deg);}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(184,255,60,.25);}
.btn-login:disabled{opacity:.6;transform:none;cursor:not-allowed;}
.err{
  margin-top:1rem;padding:.75rem 1rem;
  background:rgba(255,70,70,.07);border:1px solid rgba(255,70,70,.2);
  border-radius:8px;font-size:.82rem;color:#ff7777;display:none;
}
.err.show{display:block;}
.back{display:block;text-align:center;margin-top:1.75rem;font-size:.8rem;color:var(--muted);transition:color .2s;}
.back:hover{color:var(--acc);}
.lock-badge{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.3rem .75rem;background:rgba(184,255,60,0.07);border:1px solid var(--bdra);
  border-radius:50px;font-family:var(--f2);font-size:.62rem;color:var(--acc);
  margin:1rem auto 0;width:fit-content;display:flex;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="brand-logo">CG<span>.</span></div>
    <div class="brand-sub">Portfolio Admin Panel</div>
  </div>

  <div class="card">
    <div class="card-icon">🔐</div>
    <h2>Welcome Back</h2>
    <p>Sign in to manage your portfolio content</p>

    <form id="lForm" onsubmit="doLogin(event)">
      <div class="fg">
        <label>Username</label>
        <input type="text" id="uname" placeholder="Enter your username" autocomplete="username" required/>
      </div>
      <div class="fg">
        <label>Password</label>
        <div class="inp-wrap">
          <input type="password" id="pw" placeholder="Enter your password" autocomplete="current-password" required/>
          <button type="button" class="eye-btn" id="eyeBtn" onclick="toggleEye()">👁</button>
        </div>
      </div>
      <div class="row">
        <label class="rem"><input type="checkbox" id="remMe"/> Remember me</label>
      </div>
      <button type="submit" class="btn-login" id="lBtn">Sign In →</button>
      <div class="err" id="errDiv">⚠ Incorrect username or password. Please try again.</div>
    </form>

    <div class="lock-badge">🔒 Secured Admin Access</div>
  </div>
  <a href="../index.html" class="back">← Back to Portfolio</a>
</div>

<script>
// ── CREDENTIALS ──
// Default: admin / Chandru@2004
// Can be changed from admin panel
function getCreds(){
  return {
    u: localStorage.getItem("cg_cu") || "admin",
    p: localStorage.getItem("cg_cp") || "Chandru@2004"
  };
}

// ── CHECK IF ALREADY LOGGED IN ──
// Only redirect to admin if explicitly logged in (not on every visit)
(function(){
  const session = sessionStorage.getItem("cg_auth");
  const persist = localStorage.getItem("cg_auth_persist");
  if(session === "1" || persist === "1"){
    window.location.replace("index.html");
  }
})();

// ── LOGIN ──
function doLogin(e){
  e.preventDefault();
  const btn = document.getElementById("lBtn");
  const err = document.getElementById("errDiv");
  const u   = document.getElementById("uname").value.trim();
  const p   = document.getElementById("pw").value;
  const rem = document.getElementById("remMe").checked;
  const c   = getCreds();

  btn.textContent = "Signing in…"; btn.disabled = true;
  err.classList.remove("show");

  setTimeout(()=>{
    if(u === c.u && p === c.p){
      sessionStorage.setItem("cg_auth","1");
      if(rem) localStorage.setItem("cg_auth_persist","1");
      window.location.replace("index.html");
    } else {
      err.classList.add("show");
      btn.textContent = "Sign In →"; btn.disabled = false;
      document.querySelector(".card").animate(
        [{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(-5px)"},{transform:"translateX(5px)"},{transform:"translateX(0)"}],
        {duration:350,easing:"ease-in-out"}
      );
    }
  },700);
}

// ── EYE TOGGLE ──
function toggleEye(){
  const inp = document.getElementById("pw");
  const btn = document.getElementById("eyeBtn");
  if(inp.type==="password"){ inp.type="text"; btn.textContent="🙈"; }
  else { inp.type="password"; btn.textContent="👁"; }
}
</script>
</body>
</html>
